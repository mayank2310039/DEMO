<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROSS ORIGIN RESOURCE SHARING</title>
    <script src="http://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script>
        async function sendRequest(){
            const responce = await axios.post("http://localhost/:3000/sum",{
            a: document.getElementById("a").value,
            b: document.getElementById("b").value
        })
        console.log(responce.data);
    }
        

    </script>
</head>
<body>
    <input type="text" id="a" placeholder="Frist value"></input>
    <input type="text" id="b" placeholder="second value"></input>
    <button onclick="sendRequest()">Find sum</button>
</body>
</html>
